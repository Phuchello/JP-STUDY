name: Content QA & Adversarial Release Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'qa/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/content-qa.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'qa/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/content-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  content-qa-gate:
    name: Content QA & Release Gate Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2. Install documented testing dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 3. Validate cross-mock uniqueness and JSON structural integrity
      - name: Validate mock uniqueness and structure
        run: |
          python scripts/curriculum/validate_mock_uniqueness.py

      # 4 & 5. Verify raw blind-review immutability and derived semantic mapping
      - name: Verify blind review immutability and semantic remapping
        run: |
          python scripts/curriculum/audit_blind_remapping_integrity.py

      # 6. Reconcile review evidence against strict deterministic gate
      - name: Reconcile review evidence
        run: |
          python scripts/curriculum/reconcile_mock_blind_review.py

      # 7. Validate question-version content fingerprints
      - name: Validate question-version content fingerprints
        run: |
          python scripts/curriculum/question_fingerprint.py

      # 8. Run adversarial negative mutation suite (real pipeline mutations)
      - name: Run adversarial mutation suite
        run: |
          python -m unittest scripts/tests/test_adversarial_release_gate.py

      # 9. Dynamically discover and audit every active N2 mock exam
      - name: Dynamically discover and audit all active N2 mock exams
        run: |
          python scripts/curriculum/audit_all_active_mocks_dynamically.py


      # 12. Run full unit and regression test suite
      - name: Run full regression test suite
        run: |
          python -m unittest discover -s scripts/tests

      # 13. Run fast browser E2E smoke tests
      - name: Run fast browser E2E smoke tests
        run: |
          npm install playwright
          npx playwright install chromium --with-deps
          node scripts/tests/smoke_browser_e2e.cjs

      - name: Run N2-MOCK-07 browser regression
        run: node scripts/tests/test_n2_mock_07_e2e.cjs

      - name: Run N2-MOCK-09 browser regression
        run: node scripts/tests/test_n2_mock_09_e2e.cjs

      - name: Verify released mock listening audio in Chromium
        run: |
          node scripts/tests/verify_n2_mock_07_audio_deep.cjs
          node scripts/tests/verify_n2_mock_09_audio_deep.cjs

      # 14. Produce machine-readable QA summary
      - name: Generate machine-readable CI QA summary
        run: |
          python scripts/ci/generate_ci_qa_summary.py

      # 14. Upload test results and QA audit artifacts
      - name: Upload QA audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-qa-audit-reports
          path: |
            qa/*.json
            qa/*.csv
            qa/*.md
          retention-days: 30

  deploy-pages:
    name: Gated Deployment to GitHub Pages
    needs: [content-qa-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
