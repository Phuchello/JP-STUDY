/viết ai–việc gì–khi nào; chờ phản hồi rồi tự xác nhận dữ kiện mới. Chỉ học câu cần dùng hôm nay."},{"id":"T04","nameVi":"Xin nghỉ làm một buổi/ngày","nameJa":"休みの相談","level":"N4 nền / giao tiếp sơ cấp (ước lượng)","skill":"Viết / nói","meaningVi":"Xin nghỉ làm một buổi/ngày; hiểu ý trước khi thay ô, không dùng như kịch bản cố định.","formula":"【日付】は【理由：Nの／V普通形／ナ形容詞な】ため、お休みをいただけますか。必要な手続きがあれば教えてください。","sources":[{"title":"Japan Foundation Irodori Sơ cấp 1: hội thoại, công việc, lịch sự","url":"https://hn.jpf.go.jp/irodori/so-cap-1"},{"title":"TUFS 理由","url":"https://www.coelang.tufs.ac.jp/mt/ja/gmod/contents/explanation/081.html"},{"title":"TUFS 断り方","url":"https://www.coelang.tufs.ac.jp/mt/ja/gmod/contents/explanation/064.html"}],"tags":["viết","nói","trường","công việc"],"prerequisites":["Đọc kana và hiểu từ trong ví dụ; ôn thể thường/て/た khi cần"],"typicalMisunderstanding":"Nói 休みます như đã tự chốt khi cần xin duyệt.","reviewStrategy":"Che ví dụ, tự nói lại ý rồi đổi một chi tiết; kiểm lại bằng tình huống mới sau ít nhất 3 ngày khi có câu chưa thấy.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"template":"【日付】は【理由：Nの／V普通形／ナ形容詞な】ため、お休みをいただけますか。必要な手続きがあれば教えてください。","example":"来週の火曜日は学校の試験のため、お休みをいただけますか。必要な手続きがあれば教えてください。","exampleVi":"Xin nghỉ thứ ba tuần tới vì thi ở trường và hỏi thủ tục.","formality":"Lịch sự với cấp trên; câu xin phép, không đảm bảo được nghỉ. Làm theo quy định nơi làm.","commonMistake":"Nói 休みます như đã tự chốt khi cần xin duyệt.","exerciseVi":"Đổi ngày và lý do do bạn lựa chọn.","dialogue":"A：金曜日の夜、食事に行きませんか。\nB：すみません、その日は予定があります。また今度お願いします。\nA：分かりました。","dialogueVi":"Đối thoại phụ luyện từ chối lời mời lịch sự; không phải xin nghỉ.","roleplayPrompt":"Đóng vai đồng nghiệp mời ăn. Tôi từ chối nhẹ và có thể đề xuất hôm khác. Không coi mọi ちょっと là từ chối ngoài ngữ cảnh lời mời." },{"id":"T06","nameVi":"Xác nhận lịch và hỏi tiếp","nameJa":"予定確認","level":"N4 nền / giao tiếp sơ cấp (ước lượng)","skill":"Viết / nói","meaningVi":"Xác nhận lịch và hỏi tiếp; hiểu ý trước khi thay ô, không dùng như kịch bản cố định.","formula":"【予定】は【日時・場所】でよろしいですか。【追加の質問】。","sources":[{"title":"Japan Foundation Irodori Sơ cấp 1: hội thoại, công việc, lịch sự","url":"https://hn.jpf.go.jp/irodori/so-cap-1"}],"tags":["viết","nói","trường","công việc"],"prerequisites":["Đọc kana và hiểu từ trong ví dụ; ôn thể thường/て/た khi cần"],"typicalMisunderstanding":"Chỉ hỏi giờ nhưng bỏ ngày/địa điểm, hiểu 予定 là đã chốt mọi điều.","reviewStrategy":"Che ví dụ, tự nói lại ý rồi đổi một chi tiết; kiểm lại bằng tình huống mới sau ít nhất 3 ngày khi có câu chưa thấy.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"template":"【予定】は【日時・場所】でよろしいですか。【追加の質問】。","example":"面談は金曜日の午後3時、2番の教室でよろしいですか。何を持っていけばいいですか。","exampleVi":"Xác nhận phỏng vấn thứ sáu 15 giờ phòng 2; hỏi mang gì.","formality":"Lịch sự. Nói đơn giản: 金曜日の3時ですね. Thân mật với bạn: 3時でいい？","commonMistake":"Chỉ hỏi giờ nhưng bỏ ngày/địa điểm, hiểu 予定 là đã chốt mọi điều.","exerciseVi":"Đổi lịch từ thứ sáu sang thứ hai rồi hỏi thời lượng.","dialogue":"A：面談は3時ですね。\nB：はい、2番の教室です。\nA：何分ぐらいかかりますか。\nB：20分ぐらいです。","dialogueVi":"Xác nhận giờ, nhận nơi, hỏi tiếp thời lượng.","roleplayPrompt":"Đóng vai giáo viên, cho một thông tin chưa đủ để tôi hỏi tiếp; không đưa tất cả ngay.","correctionRule":"Nói/viết ai–việc gì–khi nào; chờ phản hồi rồi tự xác nhận dữ kiện mới. Chỉ học câu cần dùng hôm nay."},{"id":"T07","nameVi":"Xin làm rõ chỉ dẫn","nameJa":"指示確認","level":"N4 nền / giao tiếp sơ cấp (ước lượng)","skill":"Viết / nói","meaningVi":"Xin làm rõ chỉ dẫn; hiểu ý trước khi thay ô, không dùng như kịch bản cố định.","formula":"【聞き取った内容】ということですか。【不明点】はどうすればいいですか。","sources": ng":"Đổ lỗi cho người khác khi chưa rõ; giấu phần chưa biết.","reviewStrategy":"Che ví dụ, tự nói lại ý rồi đổi một chi tiết; kiểm lại bằng tình huống mới sau ít nhất 3 ngày khi có câu chưa thấy.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"template":"【時刻：8時など】に、【場所】で【問題】が起きました。今は【状況】です。どうすればいいですか。","example":"レジのプリンターが止まりました。今は印刷できません。どうすればいいですか。","exampleVi":"Máy in quầy thu ngân dừng, hiện chưa in được, hỏi xử lý.","formality":"Lịch sự, báo sự kiện quan sát; nếu có nguy hiểm thật, theo quy trình và người phụ trách.","commonMistake":"Đổ lỗi khi chưa rõ; giấu phần chưa biết. Mốc giờ dùng に, nơi sự việc dùng で; 今日／昨日 thường không thêm に.","exerciseVi":"Đổi từ máy in sang không tìm thấy tài liệu.","dialogue":"A：印刷できません。どうすればいいですか。\nB：まず、担当の人を呼んでください。\nA：はい。担当の人を呼びます。","dialogueVi":"Báo không in được, được yêu cầu gọi người phụ trách, tự nhắc lại.","roleplayPrompt":"Đóng vai đồng nghiệp: hỏi vấn đề, đưa một việc đơn giản; không tự hướng dẫn sửa máy nguy hiểm. Đợi tôi nhắc lại.","correctionRule":"Nói/viết ai–việc gì–khi nào; chờ phản hồi rồi tự xác nhận dữ kiện mới. Chỉ học câu cần dùng hôm nay."},{"id":"T09","nameVi":"Nhật ký ba câu","nameJa":"短い日記","level":"N4 nền / giao tiếp sơ cấp (ước lượng)","skill":"Viết / nói","meaningVi":"Nhật ký ba câu; hiểu ý trước khi thay ô, không dùng như kịch bản cố định.","formula":"今日は【出来事】。 【気づき・気持ち】。次は【小さな行動】。","sources":[{"title":"Japan Foundation Irodori Sơ cấp 1: hội thoại, công việc, lịch sự","url":"https://hn.jpf.go.jp/irodori/so-cap-1"}],"tags":["viết","nói","trường","công việc"],"prerequisites":["Đọc kana và hiểu từ trong ví dụ; ôn thể thường/て/た khi cần"],"typicalMisunderstanding":"Bịa “mỗi ngày học lâu”; dịch nhật ký dài làm tăng việc.","reviewStrategy":"Che ví dụ, tự nói lại ý rồi đổi một chi tiết; kiểm lại bằng tình huống mới sau ít nhất 3 ngày khi có câu chưa thấy.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"template":"今日は【出来事】。 【気づき・気持ち】。次は【小さな行動】。","example":"今日は授業のあとで買い物をしました。店員さんの説明が少し分かりました。次は自分から質問したいです。","exampleVi":"Hôm nay đi mua sắm sau lớp; hiểu được chút lời nhân viên; lần tới muốn chủ động hỏi.","formality":"Nhật ký cá nhân: thể thường hoặc です/ます nhất quán; không cần văn kinh doanh.","commonMistake":"Bịa “mỗi ngày học lâu”; dịch nhật ký dài làm tăng việc.","exerciseVi":"Đổi một việc đã làm thật hôm nay, tối đa ba câu.","dialogue":"A：今日はどうでしたか。\nB：少し疲れましたが、店で質問できました。\nA：何を聞いたんですか。\nB：値段を聞きました。","dialogueVi":"Mệt nhưng hỏi được giá; đây là trò chuyện thân thiện có đuôi lịch sự.","roleplayPrompt":"Hỏi tôi một việc trong ngày rồi một câu hỏi tiếp; không buộc viết dài hoặc tiết lộ việc riêng.","correctionRule":"Nói/viết ai–việc gì–khi nào; chờ phản hồi rồi tự xác nhận dữ kiện mới. Chỉ học câu cần dùng hôm nay."},{"id":"T10","nameVi":"Nêu ý kiến ngắn và chưa chắc","nameJa":"意見・不確かさ","level":"N4 nền / giao tiếp sơ cấp (ước lượng)","skill":"Viết / nói","meaningVi":"Nêu ý kiến ngắn và chưa chắc; hiểu ý trước khi thay ô, không dùng như kịch bản cố định.","formula":"私は【意見：V・イ形容詞普通形／N・ナ形容詞だ】と思います。【理由】からです。まだ【不確かな点】は分かりません。","sources":[{"title":"Japan Foundation Irodori Sơ cấp 1: hội thoại, công việc, lịch sự","url":"https://hn.jpf.go.jp/irodori/so-cap-1"}],"tags":["viết","nói","trường","công việc"],"prerequisites":["Đọc kana và hiểu từ trong ví dụ; ôn thể thường/て/た khi cần"],"typicalMisunderstanding":"Nói ý kiến thành sự thật chung; gắn 思います sau thể ます.","reviewStrategy":"Che ví dụ, tự nói lại ý rồi đổi một chi tiết; kiểm lại bằng tình huống mới sau ít nhất 3 ngày khi có câu chưa thấy.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"template":"私は【意見：V・イ形容詞普通形／N・ナ形容詞だ】と思います。【理由】からです。まだ【不確かな点】は分かりません。","example":"私は短い練習が続けやすいと思います。時間を取りやすいからです。長い練習の効果はまだ分かりません。","exampleVi":"Nghĩ bài ngắn dễ duy trì vì dễ dành thời gian; chưa biết hiệu quả buổi dài. Đây là ý kiến cá nhân, không phải kết luận khoa học.","formality":"Lịch sự khi trao đổi; với bạn thân có thể bỏ です/ます nhưng giữ ý.","commonMistake":"Nói ý kiến thành sự thật chung; gắn 思います sau thể ます.","exerciseVi":"Đổi chủ đề sang đi tàu/xe đạp, nói một điều chưa chắc.","dialogue":"A：この方法はどうですか。\nB：便利だと思いますが、まだよく分かりません。\nA：どの点が分かりませんか。","dialogueVi":"Nêu tiện nhưng chưa chắc, người nghe hỏi phần chưa rõ.","roleplayPrompt":"Hỏi ý kiến về lựa chọn học thật; chấp nhận まだ分かりません và hỏi một phần cụ thể, không ép chắc chắn.","correctionRule":"Nói/viết ai–việc gì–khi nào; chờ phản hồi rồi tự xác nhận dữ kiện mới. Chỉ học câu cần dùng hôm nay."},{"id":"T11","nameVi":"Đưa lý do và ví dụ","nameJa":"理由・具体例","level":"N4 nền / giao tiếp sơ cấp (ước lượng)","skill":"Viết / nói","meaningVi":"Đưa lý do và ví dụ; hiểu ý trước khi thay ô, không dùng như kịch bản cố định.","formula":"【意見】。なぜなら、【理由：V・イ形容詞普通形／N・ナ形容詞だ】からです。例えば、【具体例】。","sources":[{"title":"Japan Foundation Irodori Sơ cấp 1: hội thoại, công việc, lịch sự","url":"https://hn.jpf.go.jp/irodori/so-cap-1"}],"tags":["viết","nói","trường","công việc"],"prerequisites":["Đọc kana và hiểu từ trong ví dụ; ôn thể thường/て/た khi cần"],"typicalMisunderstanding":"Ví dụ không minh họa lý do. Trong khung bài tập này dùng cặp なぜなら…からです; đây không phải cách kết duy nhất của なぜなら trong mọi văn cảnh tiếng Nhật.","reviewStrategy":"Che ví dụ, tự nói lại ý rồi đổi một chi tiết; kiểm lại bằng tình huống mới sau ít nhất 3 ngày khi có câu chưa thấy.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"template":"【意見】。なぜなら、【理由：V・イ形容詞普通形／N・ナ形容詞だ】からです。例えば、【具体例】。","example":"私は通学の時間を短くしたいです。なぜなら、休む時間を増やしたいからです。例えば、近い学校なら、帰宅後に少し休めます。","exampleVi":"Ý muốn giảm thời gian đi học, lý do nghỉ nhiều hơn, ví dụ cụ thể; chỉ là bài tập hư cấu.","formality":"Văn bài tập lịch sự; trong nói có thể nối thẳng 理由ので/から, không cần なぜなら.","commonMistake":"Ví dụ không minh họa lý do. Trong khung bài tập này dùng cặp なぜなら…からです; đây không phải cách kết duy nhất của なぜなら trong mọi văn cảnh tiếng Nhật.","exerciseVi":"Đổi ý kiến và giữ một ví dụ thật liên quan.","dialogue":"A：どうしてこの店を選んだんですか。\nB：安くて、駅に近いからです。\nA：そうなんですね。","dialogueVi":"Hỏi lý do chọn quán; đáp hai điểm liên quan.","roleplayPrompt":"Hỏi vì sao tôi chọn một phương án; yêu cầu một ví dụ khi lý do quá chung, không đưa sẵn đáp án.","correctionRule":"Nói/viết ai–việc gì–khi nào; chờ phản hồi rồi tự xác nhận dữ kiện mới. Chỉ học câu cần dùng hôm nay."},{"id":"T12","nameVi":"Bài viết học đường ngắn","nameJa":"短い作文","level":"N4 nền / giao tiếp sơ cấp (ước lượng)","skill":"Viết / nói","meaningVi":"Bài viết học đường ngắn; hiểu ý trước khi thay ô, không dùng như kịch bản cố định.","formula":"【主題・意見】。まず、【理由1】。例えば、【具体例】。だから、【まとめ・次の行動】。","sources":[{"title":"Japan Foundation Irodori Sơ cấp 1: hội thoại, công việc, lịch sự","url":"https://hn.jpf.go.jp/irodori/so-cap-1"}],"tags":["viết","nói","trường","công việc"],"prerequisites":["Đọc kana và hiểu từ trong ví dụ; ôn thể thường/て/た khi cần"],"typicalMisunderstanding":"Chép nguyên mẫu không thay ý; thiếu câu trả lời đúng đề; đổi thể giữa chừng.","reviewStrategy":"Che ví dụ, tự nói lại ý rồi đổi một chi tiết; kiểm lại bằng tình huống mới sau ít nhất 3 ngày khi có câu chưa thấy.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"template":"【主題・意見】。まず、【理由1】。例えば、【具体例】。だから、【まとめ・次の行動】。","example":"私は日本語で質問できるようになりたいです。まず、分からないことを確認したいからです。例えば、仕事の時間を聞き直せると安心です。だから、短い質問を練習します。","exampleVi":"Chủ đề muốn hỏi bằng tiếng Nhật; lý do xác nhận điều chưa hiểu; ví dụ hỏi lại giờ làm; hành động luyện câu hỏi ngắn.","formality":"Văn bài tập kiểu です/ます; kiểm yêu cầu số chữ, chủ đề, quy định trường trước khi dùng. JLPT không thi viết trực tiếp.","commonMistake":"Chép nguyên mẫu không thay ý; thiếu câu trả lời đúng đề; đổi thể giữa chừng.","exerciseVi":"Viết bốn câu về một việc muốn cải thiện; kiểm xem ví dụ có hỗ trợ ý không.","dialogue":"A：何について書きますか。\nB：仕事で使う日本語についてです。\nA：具体的な例はありますか。\nB：時間を確認する質問です。","dialogueVi":"Người học chọn chủ đề, được hỏi ví dụ cụ thể.","roleplayPrompt":"Đóng vai giáo viên hỗ trợ bài ngắn. Hỏi chủ đề và ví dụ từng lượt, không viết hộ toàn bài; yêu cầu tôi tự sửa một câu.","correctionRule":"Nói/viết ai–việc gì–khi nào; chờ phản hồi rồi tự xác nhận dữ kiện mới. Chỉ học câu cần dùng hôm nay."},{"id":"G08","nameVi":"Chia thể trước khi nối mẫu","nameJa":"て形・た形・ない形","level":"N4 nền (ước lượng)","skill":"Ngữ pháp","meaningVi":"Xác định nhóm động từ trước. Thể て nối nhờ vả/tiến trình; thể た đi với kinh nghiệm đã từng; thể ない đi với phủ định. Nghĩa của cả mẫu không chỉ là nghĩa của một đuôi.","formula":"飲む→飲んで／飲んだ／飲まない; 見る→見て／見た／見ない; する→して／した／しない; 行く→行って／行った／行かない","minimalPair":"日本で働いたことがあります。／今、日本で働いています。","contrastVi":"Câu đầu nêu kinh nghiệm từng làm; câu sau nói hiện đang làm việc ở Nhật. ておく (làm trước để chuẩn bị) khác cả hai, xem TUFS088.","commonMistake":"Chỉ nhìn đuôi る rồi đoán nhóm; dùng thể từ điển trước たことがある; nhầm kinh nghiệm với hiện trạng.","correctionRule":"Đọc yêu cầu cần thể gì, gọi dạng trước khi nhìn lựa chọn, rồi kiểm cả nghĩa mẫu. Động từ đuôi る cần biết đúng nhóm, không đoán tuyệt đối.","prerequisites":["Thể từ điển; ba nhóm động từ"],"typicalMisunderstanding":"Nhận ra chữ Hán nhưng chưa tự gọi được thể động từ.","reviewStrategy":"Che các dạng, tự đổi một động từ cùng nhóm; thử câu mới sau chậm khi đủ sức.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"tags":["chia thể","động từ","kinh nghiệm"],"sources":[{"title":"TUFS 普通形の体系","url":"https://www.coelang.tufs.ac.jp/mt/ja/gmod/contents/explanation/038.html"},{"title":"JF Irodori Sơ cấp 1 L8: kinh nghiệm","url":"https://hn.jpf.go.jp/irodori/so-cap-1"},{"title":"TUFS ておく","url":"https://www.coelang.tufs.ac.jp/mt/ja/gmod/contents/explanation/088.html"}],"practice":[{"stem":"「飲む」をて形にしてください。","options":["飲んで","飲って"],"correctIndex":0,"answerVi":"1. 飲む thuộc nhóm đuôi む: む→んで; không phải って.","scored":false},{"stem":"「まだ一度も行った経験がない。」同じ意味は？","options":["行っておきます。","行ったことがありません。"],"correctIndex":1,"answerVi":"2. たことがありません nêu chưa từng; ておく là chuẩn bị trước.","scored":false},{"stem":"「見る」をない形にしてください。","options":["見ない","見らない"],"correctIndex":0,"answerVi":"1. 見る nhóm 2: bỏ る rồi thêm ない.","scored":false}]},{"id":"G09","nameVi":"Được, cấm, phải và không cần","nameJa":"許可・禁止・義務","level":"N4 nền (ước lượng)","skill":"Ngữ pháp","meaningVi":"てもいい: được phép; てはいけない: bị cấm; なければならない: cần/phải làm; なくてもいい: không bắt buộc. Không cần làm không đồng nghĩa bị cấm làm.","formula":"Vて＋もいいです / Vて＋はいけません / Vない（bỏ い）＋ければなりません / Vない（bỏ い）＋くてもいいです","minimalPair":"今日は残らなければなりません。／今日は残らなくてもいいです。","contrastVi":"Hôm nay phải ở lại; hôm nay không cần ở lại. Cả hai có dấu hiệu phủ định trong cấu trúc nhưng nghĩa vụ trái nhau. 残る: ở lại.","commonMistake":"Thấy ない rồi suy cả hai đều cấm; lẫn được phép với bắt buộc.","correctionRule":"Đọc trọn phần sau động từ; tự gọi đúng một ý: được / cấm / phải / không cần, rồi đổi tình huống.","prerequisites":["Thể て và ない; cách đổi nhóm động từ"],"typicalMisunderstanding":"Chỉ bắt dấu phủ định mà bỏ nghĩa cả mẫu.","reviewStrategy":"Che cặp mẫu, tự nói một quy định hư cấu rồi đổi thành không bắt buộc. Sau chậm thử một câu chưa thấy, không dùng lại điểm cũ.","reviewStatus":"AI soạn gốc; đã qua rà nội dung độc lập và sửa theo nguồn 15/10/2026; chưa thẩm định bản ngữ/hiệu chuẩn người học.","origin":"Original instructional card, not official JLPT item","estimatedMinutes":4,"tags":["xin phép","quy định","nghĩa vụ","phủ định"],"sources":[{"title":"TUFS 許可","url":"https://www.coelang.tufs.ac.jp/mt/ja/gmod/contents/explanation/058.html"},{"title":"TUFS 禁止","url":"https://www.coelang.tufs.ac.jp/mt/ja/gmod/contents/explanation/059.html"},{"title":"JF 文-53 Vなければなりません","url":"https://www.jpf.go.jp/j/urawa/j_rsorcs/textbook/setsumei_pdf/setsumei14_2.pdf"},{"title":"JF Bangkok Akiko5: quy định và việc không cần làm","url":"https://ba.jpf.go.jp/wp-content/uploads/2022/03/Akiko5_bunpoo382002.pdf"}],"practice":[{"stem":"「この紙は出さなくてもいいです。」同じ意味は？","options":["この紙を出す必要はありません。","この紙を出してはいけません。"],"correctIndex":0,"answerVi":"1. Không cần nộp khác bị cấm nộp; đáp án2 thêm lệnh cấm không có trong câu.","scored":false},{"stem":"「ここでは、写真を撮ることは禁止です。」同じ意味は？","options":["写真を撮ってもいいです。","写真を撮ってはいけません。"],"correctIndex":1,"answerVi":"2. 禁止 là bị cấm, dùng てはいけません; てもいい là được phép, trái ý.","scored":false},{"stem":"「必ず、名前を書いてください。」必要があることを表す文は？","options":["名前を書かなければなりません。","名前を書かなくてもいいです。"],"correctIndex":0,"answerVi":"1. 必ず yêu cầu phải ghi; なければなりません giữ ý bắt buộc. Đáp án2 bỏ nghĩa vụ.","scored":false}]}],"officialListeningMap":{"N4":["課題理解","ポイント理解","発話表現","即時応答"],"N3":["課題理解","ポイント理解","概要理解","発話表現","即時応答"],"N2":["課題理解","ポイント理解","概要理解","即時応答","統合理解"]},"frequencyClaim":"Không có dữ liệu tần suất; các tình huống do dự án chọn để luyện, không gọi là thường ra nhất.","unscoredPracticeCount":37,"reviewLimit":"31 cards and 37 instructional examples independently AI-reviewed; separate from 80 objective bank items. No human-native or acoustic calibration.","registerGuide":{"casual":"Bạn thân: もう一度言って。 Có thể quá suồng sã với giáo viên/cấp trên.","polite":"Giáo viên/người chưa thân: もう一度言っていただけますか。 Hoặc もう一度お願いします khi ngữ cảnh rõ.","business":"Email doanh nghiệp có thể cần tên/đơn vị, chào mở và kết phù hợp. Các thẻ ở đây là giao tiếp lịch sự trong trường/nơi làm, chưa là bộ mẫu thư thương mại; không thêm kính ngữ dài khi chưa hiểu."}};
</script><script>(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else root.JLPT=api;})(typeof globalThis!=='undefined'?globalThis:this,function(){
 'use strict';
 const VERSION='1.0.0',SCHEMA=1,DAY=86400000;
 const ASSIST=['hint','transcript','replayed-audio','no-audio','gemini','answer-key','worked-example'];
 const MODES={quick:{label:'QUICK',minutes:5,min:3,max:5,training:true},standard:{label:'STANDARD',minutes:15,min:8,max:12,training:false},deep:{label:'DEEP',minutes:30,min:12,max:20,training:false},review:{label:'Ôn lỗi',minutes:5,min:3,max:5,training:true}};
 function id(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'s-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
 function iso(now){return new Date(now===undefined?Date.now():now).toISOString();}
 function localDate(now){const d=new Date(now===undefined?Date.now():now);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
 function fresh(bank){return {schemaVersion:SCHEMA,appVersion:VERSION,bankVersion:bank.bankVersion,answerKeyDigest:bank.answerKeyDigest,attempts:[],exposures:[],sessions:[],diagnostics:[],reflections:{},speaking:[],active:null,createdAt:iso(),updatedAt:iso()};}
 function clone(v){return JSON.parse(JSON.stringify(v));}
 function question(bank,qid){const q=bank.questions.find(q=>q.id===qid);if(!q)throw Error('Mã câu không có trong ngân hàng: '+qid);return q;}
 function score(q,a){
  if(a===null||a===undefined||a==='')return {status:'unanswered',attempted:false,correct:null};
  if(typeof a!=='string'||!q.options.some(o=>o.id===a))return {status:'invalid',attempted:false,correct:null};
  return {status:a===q.correctAnswer?'correct':'incorrect',attempted:true,correct:a===q.correctAnswer};
 }
 function checkBank(bank){
  if(!bank||!Array.isArray(bank.questions)||!bank.questions.length)throw Error('Ngân hàng trống.');
  const ids=new Set(),stems=new Set();
  for(const q of bank.questions){
   for(const k of ['id','level','categoryCode','conceptId','learningObjective','stem','correctAnswer','explanationVi','errorCategory','reviewRecommendation','origin'])if(typeof q[k]!=='string'||!q[k].trim())throw Error(q.id+': thiếu '+k);
   if(ids.has(q.id))throw Error('Trùng mã câu');ids.add(q.id);
   if(stems.has(q.stem+(q.passage||q.audio?.script||'')))throw Error('Trùng nội dung câu');stems.add(q.stem+(q.passage||q.audio?.script||''));
   if(!Array.isArray(q.options)||q.options.length<2||new Set(q.options.map(x=>x.id)).size!==q.options.length||new Set(q.options.map(x=>x.text)).size!==q.options.length)throw Error(q.id+': lựa chọn lỗi');
   if(!q.options.some(x=>x.id===q.correctAnswer))throw Error(q.id+': khóa không có trong lựa chọn');
   if(!q.prerequisites?.length||!q.references?.length||!q.estimatedSeconds)throw Error(q.id+': thiếu dữ liệu dạy học');
   for(const o of q.options)if(o.id!==q.correctAnswer&&!q.distractorExplanations?.[o.id])throw Error(q.id+': thiếu giải thích nhiễu');
   if(q.passage&&!q.evidence)throw Error(q.id+': thiếu bằng chứng đọc');
   if(q.categoryCode==='LISTEN'&&(!q.audio?.script||!q.evidence))throw Error(q.id+': thiếu kịch bản/khóa nghe');
  }return {questions:ids.size,roles:bank.roleplays?.length||0};
 }
 function prior(state,q){return {item:state.exposures.some(e=>e.questionId===q.id),stimulus:state.exposures.some(e=>e.stimulusId===q.stimulusId)};}
 function history(state,qid){return state.attempts.filter(a=>a.questionId===qid);}
 function due(state,qid,now){const h=history(state,qid),a=h[h.length-1];return !!a&&a.nextReviewAt&&Date.parse(a.nextReviewAt)<=(now===undefined?Date.now():now);}
 function status(state,q,now){
  const h=history(state,q.id),a=h[h.length-1];let label='Chưa làm';
  if(!a&&prior(state,q).item)label='Đã xem, chưa trả lời';
  if(a){if(!a.attempted)label='Đã xem, chưa trả lời';else if(!a.correct)label='Sai';else if(a.assistance.length)label='Đúng có trợ giúp';else if(!a.isItemNew||!a.isStimulusNew)label='Đúng khi ôn';else if(a.guessed)label='Đúng nhưng đã đoán';else label='Đúng tự làm';}
  return {label,due:due(state,q.id,now),last:a||null,seen:prior(state,q).item};
 }
 function conceptStats(state,bank){
  const out={};for(const [c,v]of Object.entries(bank.concepts))out[c]={id:c,title:v.title,answered:0,correct:0,assisted:0,guessed:0,wrong:0,eligible:0,eligibleCorrect:0,seconds:[],firstStudyAt:null};
  for(const a of state.attempts){const q=bank.questions.find(q=>q.id===a.questionId);if(!q)continue;const v=out[q.conceptId];if(a.attempted){v.answered++;v.correct+=a.correct?1:0;v.wrong+=a.correct?0:1;v.assisted+=a.assistance.length?1:0;v.guessed+=a.guessed?1:0;if(!v.firstStudyAt||a.answeredAt<v.firstStudyAt)v.firstStudyAt=a.answeredAt;if(a.activeSeconds>0&&!a.interrupted)v.seconds.push(a.activeSeconds);if(a.evidenceType==='independent-new'){v.eligible++;v.eligibleCorrect+=a.correct?1:0;}}}
  return out;
 }
 function select(state,bank,{mode='standard',fatigue=3,sleepy=false,audioAvailable=false,now=Date.now(),recipeId=null}={}){
  if(!MODES[mode])throw Error('Chế độ không hợp lệ.');
  if(!Number.isInteger(fatigue)||fatigue<1||fatigue>5)throw Error('Chọn mức mệt 1–5.');
  if(sleepy)return {rest:true,reason:'Đang buồn ngủ: nghỉ trước, không làm bài đo.',ids:[]};
  if(mode==='deep'&&fatigue>=3)return {rest:false,blocked:true,reason:'Hôm nay nên chọn 5–15 phút; buổi dài chỉ khi đủ sức.',ids:[]};
  const tired=fatigue>=4,training=MODES[mode].training||tired;
  let pool=bank.questions.filter(q=>q.level==='N4'&&q.validation.status==='reviewed'&&(q.categoryCode!=='LISTEN'||audioAvailable));
  const recipe=recipeId&&bank.recipes?.find(r=>r.id===recipeId);if(recipe)pool=pool.filter(q=>recipe.questionIds.includes(q.id));
  if(tired||mode==='review')pool=pool.filter(q=>prior(state,q).item);
  if(!pool.length)return {rest:tired,workedExample:tired,reason:tired?'Chưa có câu cũ để ôn. Hãy nghỉ, hoặc xem một mẫu có hướng dẫn.':'Chưa có câu phù hợp để ôn; có thể bắt đầu QUICK khi đủ sức.',ids:[]};
  const cs=conceptStats(state,bank),order=Object.keys(bank.concepts),recent={};for(const a of state.attempts)if(a.attempted){const q=bank.questions.find(q=>q.id===a.questionId);if(q)(recent[q.conceptId]||=[]).push(a);} 
  const priority=c=>{
   const s=cs[c],qs=pool.filter(q=>q.conceptId===c);let p=0;
   if(qs.some(q=>due(state,q.id,now)))p+=30;
   if(s.eligible>=3&&s.eligibleCorrect/s.eligible<.6)p+=8;
   if(s.answered>=3){const tail=(recent[c]||[]).slice(-4);p+=Math.min(20,tail.filter(a=>!a.correct).length*4)+Math.min(12,tail.filter(a=>a.assistance.length).length*3)+Math.min(8,tail.filter(a=>a.guessed).length*2);}
   if(!s.answered&&['particle-place','form-te','permission'].includes(c))p+=15;
   const ds=state.diagnostics.filter(d=>d.level==='N4'&&d.total>=5&&d.correct/d.total<.6&&d.assistance==='none');
   const code=bank.concepts[c].category,diagSkill=['PART','CONJ','GRAM','ORDER'].includes(code)?'Ngữ pháp':['INTERP','SHORT','MED'].includes(code)?'Đọc':code==='LISTEN'?'Nghe':code==='VOC'?'Từ và kanji':'Giao tiếp';if(ds.some(d=>d.skill===diagSkill))p+=20;
   if(s.seconds.length>=3){const med=[...s.seconds].sort((a,b)=>a-b)[Math.floor(s.seconds.length/2)],expected=qs.reduce((n,q)=>n+q.estimatedSeconds,0)/(qs.length||1);if(med>expected*1.5)p+=4;}
   return p-order.indexOf(c)/100;
  };
  const ranked=order.filter(c=>pool.some(q=>q.conceptId===c)).sort((a,b)=>priority(b)-priority(a));
  let reason='Chưa có đủ dữ liệu: bắt đầu từ cấu trúc nền N4.',chosen=[];
  const eligibleHoldout=q=>{const c=cs[q.conceptId];return !q.holdout||c.firstStudyAt&&now-Date.parse(c.firstStudyAt)>=3*DAY&&c.answered>=2;};
  const newItems=pool.filter(q=>!prior(state,q).item&&!prior(state,q).stimulus&&eligibleHoldout(q));
  const oldItems=pool.filter(q=>prior(state,q).item).sort((a,b)=>(due(state,b.id,now)?1:0)-(due(state,a.id,now)?1:0));
  if(recipe)reason='Bộ ghép từ ngân hàng; câu đã thấy vẫn tính ôn.';
  const add=q=>{if(q&&!chosen.some(x=>x.id===q.id)&&(!recipe||recipe.questionIds.includes(q.id)))chosen.push(q);};
  if(mode==='quick'||mode==='review'||tired){
   const c=ranked.find(c=>pool.filter(q=>q.conceptId===c&&q.estimatedSeconds<=75).length>=3)||ranked.find(c=>pool.some(q=>q.conceptId===c&&q.estimatedSeconds<=75));
   const candidates=(tired||mode==='review'?oldItems:[...oldItems.filter(q=>due(state,q.id,now)),...newItems,...oldItems]).filter(q=>q.conceptId===c&&q.estimatedSeconds<=75);
   [...new Map(candidates.map(q=>[q.id,q])).values()].slice(0,tired?3:4).forEach(add);
   reason=tired?'Mệt 4–5: chỉ ôn câu cũ tối đa 5 phút; nghỉ vẫn là lựa chọn phù hợp.':cs[c]?.wrong?'Mục tiêu có lỗi hoặc cần ôn: '+bank.concepts[c]?.title:'Một mục tiêu nền: '+bank.concepts[c]?.title;
   if(!chosen.length)return {blocked:true,ids:[],reason:'Không còn câu ngắn phù hợp; hãy chọn STANDARD khi đủ sức hoặc nghỉ.'};
  }else{
   const max=mode==='deep'?20:10;
   const sorted=[...newItems].sort((a,b)=>priority(b.conceptId)-priority(a.conceptId));
   const skillUse={};
   for(const code of (mode==='deep'?['MED','SHORT','VOC','LISTEN']:['SHORT','VOC','LISTEN'])){const q=sorted.find(q=>q.categoryCode===code);if(q){add(q);skillUse[code]=1;}}
   for(const q of sorted){if(chosen.length>=max-(oldItems.length?2:0))break;const skill=q.categoryCode;if((skillUse[skill]||0)>=3)continue;add(q);skillUse[skill]=(skillUse[skill]||0)+1;}
   oldItems.slice(0,2).forEach(add);
   if(chosen.length<Math.min(max,8))for(const q of [...sorted,...oldItems]){if(chosen.length>=max)break;add(q);}
   reason=newItems.length?'Ưu tiên câu chưa thấy ở nền N4, làm câu mới trước rồi ôn; chưa có điểm chuẩn hóa.':'Đã dùng hết câu mới phù hợp: phiên này là ôn, không chứng minh tiến bộ độc lập.';
  }
  if(recipe&&!chosen.length)recipe.questionIds.map(qid=>pool.find(q=>q.id===qid)).filter(Boolean).forEach(add);
  const budget=(mode==='deep'?30:mode==='standard'?15:5)*60;
  while(chosen.length>MODES[mode].min&&chosen.reduce((s,q)=>s+q.estimatedSeconds,0)>budget*.85)chosen.pop();
  if(!chosen.length)return {rest:false,blocked:true,ids:[],reason:'Không còn câu vừa thời gian trong mục tiêu này. Chọn ôn hoặc nghỉ.'};
  const sorted=training?chosen:chosen.sort((a,b)=>(prior(state,a).item?1:0)-(prior(state,b).item?1:0));
  return {rest:false,ids:sorted.map(q=>q.id),reason,training,mode:tired?'review':mode,fatigue,now,audioAvailable,estimatedSeconds:sorted.reduce((s,q)=>s+q.estimatedSeconds,0)};
 }
 function start(state,bank,selection,now){
  if(state.active)throw Error('Có buổi đang dở; tiếp tục hoặc nộp phần đã làm.');
  if(!selection.ids?.length)throw Error(selection.reason||'Chưa có câu để làm.');

function home(){view='home';app.innerHTML=`<h1>Hôm nay học một việc</h1><p>Chọn theo sức hôm nay. Nghỉ hoặc ôn vài phút đều được; giữ giờ ngủ trước.</p>${state.active?`<div class="card soft"><h2>Buổi đang dở</h2><p>Đã lưu lựa chọn. Buổi bị gián đoạn được ghi riêng.</p>${btn('Tiếp tục','continue')}${btn('Nộp phần đã xem','finish-part',true)}</div>`:''}<div class="card"><label>Mệt hôm nay <select id="fatigue"><option value="">Chọn 1–5</option><option value="1">1 · khỏe</option><option value="2">2</option><option value="3">3 · vừa</option><option value="4">4 · rất mệt</option><option value="5">5 · kiệt sức</option></select></label><label><input id="sleepy" type="checkbox"> Đang buồn ngủ, khó tập trung</label><div class="grid">${btn('QUICK · 5 phút','quick')}${btn('STANDARD · 15 phút','standard')}${btn('DEEP · 30 phút','deep',true)}${btn('Ôn câu cũ · ≤5 phút','review',true)}${btn('Hôm nay nghỉ','rest',true)}</div><p id="voice-status" class="muted"></p><p><a href="https://www.irodori.jpf.go.jp/elementary01/audio/lesson14.html" target="_blank" rel="noopener">Nghe Irodori: liên lạc xin nghỉ · MP3 chính thức</a> (cần mạng, không phải điểm JLPT).</p><small>QUICK luyện một mục tiêu, chấm ngay. STANDARD/DEEP chấm sau khi nộp, câu mới trước câu ôn. Có thể dừng giữa buổi.</small></div><details class="card"><summary>Tùy chọn: luyện một bộ theo mục tiêu</summary><label>Bộ ngắn <select id="recipe">${B.recipes.map(r=>`<option value="${r.id}">${esc(r.id+' · '+r.objective)}</option>`).join('')}</select></label>${btn('Luyện bộ đã chọn','recipe-start',true)}<small>Dùng lại cùng 80 câu, vẫn ghi mới/ôn. Đây là luyện có hướng dẫn; không cộng vào điểm mới độc lập.</small></details><div class="card"><h2>Nghe và nói để dùng ngay</h2><p>Chọn một vai 3 phút; điểm nói được giữ riêng với câu trắc nghiệm.</p><div class="row">${B.roleplays.map(r=>`<button class="secondary role" data-id="${r.id}">${esc(r.learningObjective)}</button>`).join('')}</div></div><p><a href="../START_HERE.pdf">Hướng dẫn 3 trang</a> · <a href="#library">Học một mẫu 3–5 phút</a> · <a href="#keys">Xem khóa sau khi làm</a></p>`;
readVoices();['quick','standard','deep','review'].forEach(mode=>on(mode,()=>{if(state.active)throw Error('Hãy tiếp tục hoặc nộp buổi đang dở trước.');const v=document.querySelector('#fatigue').value;if(!v)throw Error('Chọn mức mệt hôm nay trước.');const sel=E.select(state,B,{mode,fatigue:Number(v),sleepy:document.querySelector('#sleepy').checked,audioAvailable:voices.length>0});if(!sel.ids.length){notice(sel.reason);return;}E.start(state,B,sel);save();location.hash='practice';route();}));on('recipe-start',()=>{if(state.active)throw Error('Hãy nộp hoặc tiếp tục buổi dở trước.');const v=document.querySelector('#fatigue').value;if(!v)throw Error('Chọn mức mệt hôm nay trước.');const r=B.recipes.find(x=>x.id===document.querySelector('#recipe').value),sel=E.select(state,B,{mode:r.mode,recipeId:r.id,fatigue:Number(v),sleepy:document.querySelector('#sleepy').checked,audioAvailable:voices.length>0});if(!sel.ids.length){notice(sel.reason);return;}sel.training=true;E.start(state,B,sel);save();location.hash='practice';});on('rest',()=>notice('Đã dừng. Không có bài bù hay chuỗi ngày bắt buộc.'));on('continue',()=>{location.hash='practice';route();});on('finish-part',finish);document.querySelectorAll('.role').forEach(x=>x.onclick=()=>role(x.dataset.id));}
function practice(){view='practice';const s=state.active;if(!s){location.hash='home';return home();}const it=E.present(state,B,s.index),q=E.question(B,it.questionId);save();lastTick=Date.now();app.innerHTML=`<div class="row"><span class="badge">${E.MODES[s.mode].label} · ${s.index+1}/${s.items.length}</span><span class="badge">${it.isItemNew&&it.isStimulusNew?'Chưa thấy':'Ôn câu đã thấy'}</span><label><input id="showtimer" type="checkbox"> Hiện thời gian</label><span id="timer" hidden></span></div><p class="muted">${esc(s.reason)}</p><h1>${esc(q.category)} · ${esc(q.id)}</h1>${s.interrupted?'<p class="warn card">Buổi đã gián đoạn; kết quả câu mới được ghi riêng khỏi lượt tự làm liên tục.</p>':''}${q.passage?`<div class="card jp" lang="ja">${esc(q.passage)}</div>`:''}${q.audio?`<div class="card"><p>Âm luyện tổng hợp tiếng Nhật. ${s.training?'Nghe lại được ghi là trợ giúp.':'Một lượt nghe; chưa hiện bản chữ.'}</p>${btn('Nghe','play')}<span id="audio-status" role="status"></span>${s.training?btn('Xem bản chữ · có trợ giúp','transcript',true):''}<div id="script"></div></div>`:''}<section class="card"><h2 class="jp" lang="ja">${esc(q.stem)}</h2>${q.options.map((o,i)=>`<button class="choice" data-a="${o.id}" aria-pressed="${it.answer===o.id}" ${it.locked?'disabled':''}><b>${i+1}. ${o.id}</b> <span class="jp" lang="ja">${esc(o.text)}</span></button>`).join('')}<label><input type="checkbox" id="guess" ${it.guessed?'checked':''} ${it.locked?'disabled':''}> Tôi đã đoán, chưa hiểu chắc</label>${s.training&&!it.locked?`<div class="row">${btn('Chấm câu này','check')}${btn('Gợi ý · có trợ giúp','hint',true)}</div><p id="hint-text"></p>`:''}<div id="feedback"></div></section><div class="row">${btn(s.index+1<s.items.length?'Câu tiếp · được bỏ trống':'Nộp bài','next')}${btn('Dừng và nộp phần đã xem','finish',true)}</div><small>Phím 1–4 chọn đáp án. Trống là chưa trả lời; câu chưa mở không bị tính sai. Lựa chọn trước khi nộp được giữ trong lịch sử.</small>`;
document.querySelector('#showtimer').onchange=e=>document.querySelector('#timer').hidden=!e.target.checked;
document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>choose(x.dataset.a));document.querySelector('#guess').onchange=e=>{it.guessed=e.target.checked;save();};
on('check',()=>{if(!it.answer)throw Error('Chọn đáp án trước; nếu muốn bỏ, bấm Câu tiếp.');tick();E.checkOne(state,B);save();practice();});if(it.locked)document.querySelector('#feedback').innerHTML=explain(q,state.attempts.find(a=>a.id===s.id+':'+q.id));
on('hint',()=>{E.assist(state,'hint');document.querySelector('#hint-text').textContent=q.hintVi||q.prerequisites.join('; ');save();});on('transcript',()=>{E.assist(state,'transcript');document.querySelector('#script').innerHTML='<p class="jp" lang="ja">'+esc(q.audio.script)+'</p>';save();});
on('play',()=>play(q,it,s));on('next',()=>{tick();if(s.index+1<s.items.length){s.index++;save();practice();}else finish();});on('finish',finish);
if(q.audio&&!it.audioPlays&&!it.assistance.includes('transcript'))document.querySelectorAll('.choice').forEach(x=>x.disabled=true);
}
function choose(a){const s=state.active,it=s?.items[s.index];if(!it||it.locked)return;const q=E.question(B,it.questionId);if(q.audio&&!it.audioPlays&&!it.assistance.includes('transcript')){notice('Hãy nghe hết một lượt trước khi chọn.');return;}E.answer(state,a);save();document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',x.dataset.a===a));}
function play(q,it,s){if(!voices.length)throw Error('Thiết bị chưa có giọng Nhật; chưa thể chấm phần nghe.');if(it.locked)throw Error('Câu này đã chấm. Xem bản chữ trong phần chữa.');if(!s.training&&it.audioPlays)throw Error('Lượt đo chỉ nghe một lần.');speechSynthesis.cancel();if(it.audioPlays)E.assist(state,'replayed-audio');const u=new SpeechSynthesisUtterance(q.audio.script);u.lang='ja-JP';u.voice=voices[0];u.rate=.9;document.querySelector('#play').disabled=true;u.onend=()=>{it.audioPlays++;save();const status=document.querySelector('#audio-status');if(status)status.textContent=' Đã nghe hết '+it.audioPlays+' lượt.';const b=document.querySelector('#play');if(b)b.disabled=!s.training;document.querySelectorAll('.choice').forEach(x=>x.disabled=it.locked);};u.onerror=()=>{E.assist(state,'no-audio');save();notice('Không phát được âm Nhật. Nộp phần này hoặc xem bản chữ trong chế độ luyện; không tính là nghe độc lập.');};speechSynthesis.speak(u);}
function finish(){tick();if('speechSynthesis'in window)speechSynthesis.cancel();lastResult=E.submit(state,B);save();location.hash='results';results(lastResult.id);}
function explain(q,a){return `<div class="soft card"><p><b>${a.attempted?(a.correct?'Đúng':'Chưa đúng'):'Chưa trả lời'}</b> · Bạn: ${esc(a.answer||'trống')} · Khóa: ${esc(q.correctAnswer)}</p><p>${esc(q.explanationVi)}</p>${a.answer&&a.answer!==q.correctAnswer?`<p>${esc(q.distractorExplanations[a.answer])}</p>`:''}${a.firstListen?`<p>Lượt nghe đầu trước hỗ trợ: ${esc(a.firstListen.answer||'trống')} · ${a.firstListen.attempted?(a.firstListen.correct?'đúng':'sai'):'chưa đáp'}. Điều kiện trợ giúp khi đó: ${esc(a.firstListen.assistance?.join(', ')||'không ghi trợ giúp')}.</p>`:''}${q.evidence?`<p>Bằng chứng: <span class="jp" lang="ja">${esc(q.evidence)}</span></p>`:''}${q.audio?`<details><summary>Bản chữ để chữa sau lượt nghe</summary><p class="jp" lang="ja">${esc(q.audio.script)}</p></details>`:''}<p><small>Lỗi nội dung: ${esc(q.errorCategory)}. Chưa thể chắc nguyên nhân trong đầu người học chỉ từ lựa chọn.</small></p><p>Nền cần: ${esc(q.prerequisites.join('; '))}</p><p><small>Nguồn khái niệm: ${q.references.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`).join(' · ')}</small></p><p>Việc tiếp: ${esc(q.reviewRecommendation)}</p>${q.patternId?`<p><a href="#library/${esc(q.patternId)}">Học mẫu liên quan 3–5 phút</a></p>`:`<p>Đọc lại giải thích và nguồn của câu, rồi tự đổi một chi tiết.</p>`}</div>`;}
function results(sid){view='results';const s=state.sessions.find(s=>s.id===sid)||state.sessions.at(-1);if(!s){home();return;}lastResult=s;const rows=state.attempts.filter(a=>a.sessionId===s.id),ind=rows.filter(a=>a.attempted&&a.evidenceType==='independent-new');app.innerHTML=`<h1>Đã học xong, có thể dừng</h1><div class="card"><h2>${s.correctCount}/${s.attemptedCount} đúng trong câu đã trả lời</h2><p>${s.unansweredCount} câu đã xem còn trống · ${s.plannedCount-s.presentedCount} câu chưa mở, không chấm.</p><p>Câu mới tự làm đủ điều kiện: ${ind.filter(a=>a.correct).length}/${ind.length}. Ôn: ${rows.filter(a=>a.evidenceType==='review').length} · trợ giúp: ${rows.filter(a=>a.evidenceType==='assisted').length} · luyện/đoán/gián đoạn: ${rows.filter(a=>!['review','assisted','independent-new'].includes(a.evidenceType)).length}.</p><small>Mẫu nhỏ, không suy ra trình độ JLPT. Cùng câu hoặc cùng đoạn đã thấy không được tính mới.</small></div><div class="row">${btn('Sao chép tối đa 3 lỗi cho Gemini','copy-errors')}${btn('Về trang học','go-home',true)}</div><div id="copy-fallback"></div><div class="card"><h2>Tự nhìn lại · tùy chọn</h2><label>Tôi hiểu gì? <select id="reflection-understood"><option value="">Chọn nếu muốn</option><option>Tự hiểu</option><option>Hiểu sau giải thích</option><option>Vẫn chưa hiểu</option></select></label><label>Lỗi lặp lại <select id="reflection-error"><option value="">Chưa biết</option><option>Từ</option><option>Ngữ pháp</option><option>Đọc sót</option><option>Nghe chưa ra âm</option><option>Quên thông tin</option></select></label><label>Việc tiếp theo <select id="reflection-next"><option value="">Chọn nếu muốn</option><option>Nghỉ</option><option>Chữa một mẫu</option><option>Nói một câu đổi chi tiết</option></select></label><small>Đáp án đoán và gợi ý đã được ghi ở từng câu.</small></div>${rows.map(a=>{const q=E.question(B,a.questionId);return `<details class="card"><summary>${esc(q.id)} · ${a.attempted?(a.correct?'đúng':'sai'):'trống'} · ${esc(a.evidenceType)}</summary><div class="jp" lang="ja">${esc(q.passage||'')}<p>${esc(q.stem)}</p></div>${explain(q,a)}<small>${esc(E.status(state,q).label)} · ôn gợi ý ${esc(a.nextReviewAt.slice(0,10))} (1/3/7/14 ngày là lịch thử).</small></details>`;}).join('')}`;
on('go-home',()=>location.hash='home');on('copy-errors',()=>copy(E.errorPackage(state,B,s.id)));['understood','error','next'].forEach(k=>{const el=document.querySelector('#reflection-'+k);el.value=state.reflections[s.id]?.[k]||'';el.onchange=()=>{state.reflections[s.id]={...(state.reflections[s.id]||{}),[k]:el.value};save();};});}
async function copy(text){try{await navigator.clipboard.writeText(text);notice('Đã sao chép. Mở Gemini và dán để chữa sau khi nộp.');}catch(e){const c=document.querySelector('#copy-fallback')||app.appendChild(document.createElement('div'));c.innerHTML='<label>Sao chép thủ công<textarea id="copy-text" readonly></textarea></label>';const x=document.querySelector('#copy-text');x.value=text;x.focus();x.select();notice('Trình duyệt không cho sao chép tự động; chữ đã được chọn để bạn sao chép.');}}
function progress(){view='progress';const d=E.summary(state,B),due=B.questions.filter(q=>E.due(state,q.id)),repeat=Object.values(d.concepts).filter(c=>c.wrong>=2).sort((a,b)=>b.wrong-a.wrong),first=state.sessions[0];app.innerHTML=`<h1>Tiến bộ từ việc đã làm</h1><div class="card"><p>${d.sessions} buổi đã nộp · ${d.seenCount}/80 câu đã thấy · còn ${d.newRemaining} câu chưa thấy.</p><p>Điểm cần củng cố: ${d.weakest?esc(d.weakest.skill)+' (n='+d.weakest.total+')':'chưa đủ ≥5 câu mới tự làm mỗi kỹ năng'}.</p><p>Điểm tương đối mạnh: ${d.strongest?esc(d.strongest.skill)+' (n='+d.strongest.total+')':'chưa đủ hai kỹ năng để so'}.</p><div class="scroll"><table><thead><tr><th>Kỹ năng</th><th>Mới tự làm</th><th>Ôn / trợ giúp / luyện</th><th>Câu mới cùng mẫu sau ≥3 ngày</th></tr></thead><tbody>${d.skills.map(s=>`<tr><td>${esc(s.skill)}</td><td>${s.correct}/${s.total}</td><td>${s.review} / ${s.assisted} / ${s.training}</td><td>${s.delayedCorrect}/${s.delayedNew}</td></tr>`).join('')}</tbody></table></div><small>Kiểm tra mới sau chậm là chuyển sang ví dụ khác; ôn đúng câu cũ là lưu giữ câu cũ. Mẫu ít và ngân hàng hữu hạn nên chưa kết luận làm chủ.</small></div><div class="card"><h2>Nói đời sống · ghi riêng</h2><p>${(state.speaking||[]).length} phiếu nói. 0 = chưa truyền đạt, 1 = truyền đạt được, ? = chưa rõ. Phát âm chưa đánh giá bằng chữ.</p>${(state.speaking||[]).slice(-3).reverse().map(r=>`<p>${esc(B.roleplays.find(x=>x.id===r.roleId)?.learningObjective)} · ${esc(r.at.slice(0,10))}: ${esc(r.intents.join(' / '))}</p>`).join('')}</div><div class="card"><h2>Việc tiếp được đề nghị</h2><p>${repeat.length?'Hai lỗi trở lên cùng mẫu; chữa ngắn rồi thử câu khác khi đủ sức.':'Chưa có mẫu lỗi lặp đủ rõ. Chọn QUICK để bắt đầu nền N4.'}</p>${repeat.slice(0,3).map(c=>`<p><a href="#library/${esc(B.questions.find(q=>q.conceptId===c.id).patternId)}">${esc(c.title)} · ${c.wrong} lỗi</a></p>`).join('')}<p>${due.length} câu đến ngày ôn. Không cần làm hết trong một buổi.</p></div><div class="card"><h2>Sau 7 và 14 ngày</h2><p>${first?'Ngày bắt đầu thực tế: '+esc(first.localDate)+'.':'Chưa có buổi bắt đầu thực tế.'} D7/D14 tính từ buổi đầu, không từ ngày tạo tệp.</p><p>D7: xem số buổi vừa sức, lỗi lặp, gợi ý và giấc ngủ tự ghi. Nếu thường quá tải, giảm số câu; không tăng giờ bằng cách bớt ngủ.</p><p>D14: so câu mới cùng mục tiêu sau ≥3 ngày (cần ít nhất 5 câu mỗi nhóm để xem xu hướng). Chưa đủ mẫu hoặc chỉ làm lại: ghi “chưa đủ dữ liệu”. Chỉ thử đoạn N3 bên ngoài khi nền N4 tự làm ổn qua hai lần khác câu; chưa mở N2 chỉ vì đến lịch.</p></div><a href="#home">Về học</a>`;}
function download(content,name,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function data(){view='data';app.innerHTML=`<h1>Giữ tiến độ của bạn</h1><div class="card"><p>${storageOK?'Ứng dụng đang lưu tự động trong trình duyệt này.':'Hiện chỉ ở bộ nhớ, hãy xuất JSON ngay khi cần giữ.'} Tệp local, chế độ riêng tư và trình duyệt khác có thể lưu khác nhau.</p><p>Trước khi đổi thiết bị hoặc xóa trình duyệt: xuất JSON, chuyển tệp, rồi nhập trên thiết bị mới. Không có đồng bộ tự động.</p><div class="row">${btn('Xuất JSON · cả buổi đang dở','export-json')}${btn('Xuất CSV cho Excel','export-csv',true)}</div><label>Nhập JSON (tối đa 10 MB)<input id="import" type="file" accept=".json,application/json"></label><p id="import-result" role="status"></p><small>Nhập gộp theo ID, không tự đổi khóa điểm cũ. Xung đột giữ nguyên bản hiện tại. Buổi dở từ thiết bị khác đánh dấu gián đoạn. Giữ bản sao trước khi gộp.</small></div><div class="card"><h2>Kết quả chẩn đoán thật · tùy chọn</h2><p>Chỉ nhập khi đã làm bài, không nhập tự đánh giá 0–5 vào đây. Thông tin này chỉ ưu tiên mục tiêu, không chứng nhận trình độ.</p><label>Kỹ năng <select id="diag-skill"><option>Ngữ pháp</option><option>Đọc</option><option>Nghe</option><option>Từ và kanji</option></select></label><div class="row"><label>Đúng <input id="diag-correct" type="number" min="0" max="200" value="0"></label><label>Tổng <input id="diag-total" type="number" min="1" max="200" value="5"></label><label>Ngày làm <input id="diag-date" type="date"></label></div><label><input id="diag-independent" type="checkbox"> N4, không xem trước, không trợ giúp</label>${btn('Lưu dữ liệu thật','diag-save',true)}<p id="diag-status"></p></div><p>Excel: nhập CSV vào trang “Luyện tập”, 12 cột A–L từ dòng 8. Đây là cầu nối thủ công; ứng dụng không mở hay sửa Excel.</p>`;
on('export-json',()=>{save();download(JSON.stringify(state,null,2),'jlpt-progress-'+E.localDate()+'.json','application/json');});on('export-csv',()=>download(E.csv(state,B),'jlpt-progress-'+E.localDate()+'.csv','text/csv;charset=utf-8'));
document.querySelector('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10e6)throw Error('Tệp lớn hơn 10 MB.');const next=E.merge(state,JSON.parse(await f.text()),B);state=next;save();document.querySelector('#import-result').textContent='Đã gộp: '+state.sessions.length+' buổi. Không có bản ghi trùng mới.';}catch(err){document.querySelector('#import-result').textContent='Chưa nhập: '+err.message;}};
on('diag-save',()=>{const c=Number(document.querySelector('#diag-correct').value),n=Number(document.querySelector('#diag-total').value),date=document.querySelector('#diag-date').value;if(!Number.isInteger(c)||!Number.isInteger(n)||n<1||n>200||c<0||c>n||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!document.querySelector('#diag-independent').checked)throw Error('Cần ngày thật, 0 ≤ đúng ≤ tổng ≤200 và xác nhận điều kiện.');state.diagnostics.push({level:'N4',skill:document.querySelector('#diag-skill').value,correct:c,total:n,date:date+'T12:00:00.000Z',assistance:'none'});save();document.querySelector('#diag-status').textContent='Đã lưu; bộ chọn sẽ ưu tiên kỹ năng thiếu nền khi có ≥5 câu.';});}
function keys(){view='keys';app.innerHTML=`<h1>Khóa và giải thích</h1><p>Mở một câu ở đây sẽ đánh dấu câu và đoạn đã thấy. Lần làm sau là ôn. Nếu đã đọc JSON/khóa ngoài ứng dụng, tự đánh dấu trước khi làm.</p><label>Mã câu <select id="key-id">${B.questions.map(q=>`<option>${q.id}</option>`).join('')}</select></label>${btn('Mở khóa · đánh dấu đã thấy','open-key')}<div id="key-detail"></div>`;on('open-key',()=>{const q=E.question(B,document.querySelector('#key-id').value);E.reviewedKey(state,B,q.id);save();document.querySelector('#key-detail').innerHTML='<p class="jp">'+esc(q.passage||q.audio?.script||'')+'<br>'+esc(q.stem)+'</p>'+explain(q,{attempted:false,correct:null,answer:null});});}
function library(pid){view='library';const d=E.summary(state,B),bad=Object.values(d.concepts).filter(c=>c.wrong>=2).sort((a,b)=>b.wrong-a.wrong),suggest=bad.length?B.questions.find(q=>q.conceptId===bad[0].id).patternId:null,p=P.patterns.find(x=>x.id===pid);app.innerHTML=`<h1>Một mẫu cần dùng</h1><p>31 thẻ nền và giao tiếp. Chỉ học thẻ liên quan; bài mở rộng là học có hướng dẫn, không nhập điểm vào ngân hàng 80 câu.</p>${suggest?`<p class="card soft">Gợi ý từ lỗi đã lặp: <a href="#library/${suggest}">${esc(P.patterns.find(x=>x.id===suggest)?.nameVi)}</a></p>`:''}<label>Tìm mục tiêu <input id="pattern-search" type="search" placeholder="trợ từ, đổi ca, nghe giờ…"></label><div id="pattern-list"></div><div id="pattern-detail"></div>`;const list=()=>{const term=document.querySelector('#pattern-search').value.toLocaleLowerCase('vi');document.querySelector('#pattern-list').innerHTML=P.patterns.filter(x=>(x.nameVi+' '+x.nameJa+' '+x.tags.join(' ')).toLocaleLowerCase('vi').includes(term)).map(x=>`<p><a href="#library/${x.id}">${esc(x.nameVi)} · ${esc(x.nameJa)}</a></p>`).join('');};document.querySelector('#pattern-search').oninput=list;list();if(p){document.querySelector('#pattern-list').hidden=true;document.querySelector('#pattern-detail').innerHTML=`<article class="card"><h2>${esc(p.nameVi)} <span lang="ja">${esc(p.nameJa)}</span></h2><p>${esc(p.meaningVi)}</p><p class="jp" lang="ja">${esc(p.formula)}</p><p>${esc(p.useWhen||'Học 3–5 phút: xem một ví dụ, che lại, tự đổi một chi tiết.')}</p>${p.signals?'<p>Tín hiệu: <span class="jp">'+esc(p.signals.join(' / '))+'</span>. Chỉ là dấu gợi ý, phải hiểu cả câu.</p>':''}${p.dialogue?'<div class="jp" lang="ja">'+esc(p.dialogue)+'</div><p>'+esc(p.dialogueVi)+'</p>':''}${p.minimalPair?'<p class="jp">'+esc(p.minimalPair)+'</p><p>'+esc(p.contrastVi)+'</p>':''}${p.template?'<h3>Khung điền</h3><p class="jp">'+esc(p.template)+'</p><p class="jp">'+esc(p.example)+'</p><p>'+esc(p.exampleVi)+'</p><small>'+esc(p.formality)+'</small>':''}<p>Dễ nhầm: ${esc(p.commonMistake)}</p><p>Sửa nhanh: ${esc(p.correctionRule||p.reviewStrategy)}</p><p><b>Tự đổi tình huống:</b> ${esc(p.exerciseVi||p.reviewStrategy)}</p>${(p.practice||[]).map((q,i)=>`<div class="soft card"><p class="jp">${esc(q.stem)}</p>${q.options.map((o,j)=>`<p>${j+1}. <span class="jp">${esc(o)}</span></p>`).join('')}<details><summary>Đã tự trả lời · mở để chữa (có trợ giúp)</summary><p>${esc(q.answerVi)}</p></details></div>`).join('')}<div class="row">${btn('Luyện mẫu · 5–10 phút','pattern-practice')}${btn('Sao chép vai Gemini','pattern-gemini',true)}</div><div id="copy-fallback"></div><p><small>${esc(p.reviewStatus)} · ${p.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`).join(' · ')}</small></p><a href="#library">Tất cả mẫu</a></article>`;on('pattern-gemini',()=>copy(patternPrompt(p)));on('pattern-practice',()=>{if(state.active)throw Error('Nộp hoặc tiếp tục buổi dở trước.');const cs=E.summary(state,B).concepts,ids=B.questions.filter(q=>q.patternId===p.id&&(q.categoryCode!=='LISTEN'||voices.length>0)&&(!q.holdout||cs[q.conceptId].firstStudyAt&&Date.now()-Date.parse(cs[q.conceptId].firstStudyAt)>=3*E.DAY&&cs[q.conceptId].answered>=2)).sort((a,b)=>(E.prior(state,a).item?1:0)-(E.prior(state,b).item?1:0)).map(q=>q.id).slice(0,5);if(!ids.length){notice('Thẻ này có bài mở rộng ngay bên trên. Tự đáp trước rồi mở lời giải; chưa có câu chấm độc lập trong ngân hàng.');return;}E.start(state,B,{ids,mode:'quick',training:true,fatigue:3,reason:'Luyện có hướng dẫn theo mẫu đã học; không tính đo độc lập.'});save();location.hash='practice';});document.querySelector('#pattern-detail').scrollIntoView();}}
function patternPrompt(p){return `Vai trò: gia sư tiếng Nhật nói tiếng Việt ngắn gọn. Đây là chữa sau bài, có trợ giúp. Mẫu ${p.id}: ${p.nameVi}.\nQuy tắc: chỉ một hiểu nhầm; giải thích ≤3 dòng và 1–2 ví dụ; hỏi một câu MỚI đổi tình huống rồi CHỜ tôi đáp, chưa lộ khóa. Sau đó sửa, yêu cầu tôi tự đặt câu, hẹn ôn ngắn và xuất checkpoint mang sang chat khác. Không tự ghi Excel hay giả vờ nhớ chat khác.\nThẻ gốc: ${p.formula}\n${p.dialogue||p.example||p.minimalPair}\n${p.roleplayPrompt||'Đóng vai trong hoàn cảnh khác, hỏi từng lượt; chấp nhận nhiều cách nói đúng ý, không buộc học thuộc câu mẫu.'}\nKhông kết luận phát âm khi chỉ đọc chữ; không gán điểm JLPT. Nếu sai ngôn ngữ trong thẻ, nêu nghi vấn và đối chiếu nguồn ${p.sources.map(x=>x.url).join(' ')}.`;}
function role(rid){if(location.hash!=='#role/'+rid){location.hash='role/'+rid;return;}view='role';const r=B.roleplays.find(r=>r.id===rid);speakingStep=0;app.innerHTML=`<h1>${esc(r.learningObjective)}</h1><div class="card"><p>${esc(r.taskVi)}</p><p>Trước tiên tự nói. Người đóng vai hoặc Gemini dùng thẻ người đối thoại; nếu đọc thẻ một mình, đây là luyện có hỗ trợ.</p><ul>${r.requiredIntents.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>${btn('Mở lượt người đối thoại tiếp','role-next')}<div id="role-turn" class="jp"></div><details><summary>Thẻ dành cho người đối thoại / Gemini</summary><p class="jp">${esc(r.partnerTurns.join('\n'))}</p><p>${esc(r.expectedInformation)}</p></details></div><div class="card"><h2>Tự ghi nhận, không phải điểm JLPT</h2>${r.requiredIntents.map((x,i)=>`<label>${esc(x)} <select class="intent" data-i="${i}"><option>?</option><option value="1">1 · truyền đạt được</option><option value="0">0 · chưa truyền đạt</option></select></label>`).join('')}<p>Phát âm: chưa đánh giá. Không dùng độ đúng chuyển giọng nói thành chữ để chấm.</p>${btn('Lưu phiếu nói riêng','role-save')}</div><a href="#home">Dừng</a>`;on('role-next',()=>{document.querySelector('#role-turn').textContent=r.partnerTurns[Math.min(speakingStep++,r.partnerTurns.length-1)];});on('role-save',()=>{state.speaking.push({id:'sp-'+Date.now().toString(36),roleId:rid,at:E.iso(),intents:[...document.querySelectorAll('.intent')].map(x=>x.value),pronunciation:'unassessed',source:'self-report'});save();notice('Đã lưu phiếu riêng. Tự nói lại với ngày/giờ khác hoặc nghỉ.');});}
function route(){notice(storageOK?'':'Chưa có lưu tự động đáng tin cậy; dùng Xuất JSON để sao lưu.');const [v,id]=location.hash.slice(1).split('/');if(state.active&&view==='practice'&&v!=='practice'){tick();state.active.interrupted=true;save();}if(state.active&&!state.active.training&&['keys','library'].includes(v)){location.hash='practice';setTimeout(()=>notice('Hãy nộp phần đã làm trước khi xem mẫu/khóa; lượt đo không có gợi ý.'),0);return;}if(state.active&&state.active.training&&['keys','library'].includes(v)){const it=state.active.items[state.active.index];if(it?.presentedAt&&!it.locked)E.assist(state,v==='keys'?'answer-key':'worked-example');save();}if(v==='practice')practice();else if(v==='results')results();else if(v==='progress')progress();else if(v==='data')data();else if(v==='keys')keys();else if(v==='role')role(id);else if(v==='library')library(id);else home();}
window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(view!=='practice'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(/^[1-4]$/.test(e.key)){e.preventDefault();choose(['A','B','C','D'][Number(e.key)-1]);}});route();
})();
</script></body></html>
